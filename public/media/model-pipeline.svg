<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1235" viewBox="0 0 1000 1235" role="img" aria-labelledby="title desc">
<title id="title">Carte du flux de données de la voie composite v6</title><desc id="desc">Dix fonctions en trois zones : préparer les modèles, exécuter une cellule bouclée, conserver puis analyser. Les retours simulés sont turquoise. Les logiciels sont en italique violet. Les identifiants sont repris dans les zooms.</desc>
