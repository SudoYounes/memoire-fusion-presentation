<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200" role="img" aria-labelledby="title desc">
  <title id="title">Chaîne cinématique normalisée du robot palettiseur Robot 2</title>
  <desc id="desc">Schéma filaire en projections verticale et horizontale. Il représente les quatre pivots J1 à J4, les segments cinématiques, les deux bielles passives de la transmission J3, les repères de Denavit-Hartenberg, les vecteurs unitaires et les angles de la posture de dépose.</desc>
  <defs>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a44b42"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#087f8c"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#174863"/>
    </marker>
    <marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#253342"/>
    </marker>
    <marker id="dim-start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M8,0 L0,4 L8,8" fill="none" stroke="#5b6773" stroke-width="1.3"/>
    </marker>
    <marker id="dim-end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#5b6773" stroke-width="1.3"/>
    </marker>
    <style><![CDATA[
      .page { fill:#ffffff; }
      .panel { fill:#fbfcfd; stroke:#cfd9df; stroke-width:1.5; }
      .title { font:700 27px 'DejaVu Sans',sans-serif; fill:#253342; }
      .subtitle { font:700 21px 'DejaVu Sans',sans-serif; fill:#174863; }
      .label { font:20px 'DejaVu Sans',sans-serif; fill:#253342; }
      .small { font:20px 'DejaVu Sans',sans-serif; fill:#5b6773; }
      .tiny { font:20px 'DejaVu Sans',sans-serif; fill:#5b6773; }
      .math { font:italic 20px 'DejaVu Serif',serif; fill:#253342; }
      .member { fill:none; stroke:#253342; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .fixed { fill:none; stroke:#253342; stroke-width:5; stroke-linecap:round; }
      .passive { fill:none; stroke:#8c969d; stroke-width:4; stroke-linecap:round; }
      .construction { fill:none; stroke:#aeb9c0; stroke-width:1.5; stroke-dasharray:7 6; }
      .dimension { fill:none; stroke:#5b6773; stroke-width:1.3; marker-start:url(#dim-start); marker-end:url(#dim-end); }
      .extension { fill:none; stroke:#aeb9c0; stroke-width:1; }
      .axis-x { fill:none; stroke:#a44b42; stroke-width:2.4; marker-end:url(#arrow-red); }
      .axis-y { fill:none; stroke:#087f8c; stroke-width:2.4; marker-end:url(#arrow-green); }
      .axis-z { fill:none; stroke:#174863; stroke-width:2.4; marker-end:url(#arrow-blue); }
      .angle { fill:none; stroke:#986119; stroke-width:2.2; marker-end:url(#arrow-dark); }
      .joint-plane { fill:#ffffff; stroke:#253342; stroke-width:3; }
      .joint-normal { fill:#ffffff; stroke:#253342; stroke-width:3; }
      .axis-dot { fill:#253342; }
      .axis-cross { stroke:#253342; stroke-width:2.6; stroke-linecap:round; }
      .frame { font:700 20px 'DejaVu Sans',sans-serif; fill:#174863; }
      .dimtext { font:20px 'DejaVu Sans',sans-serif; fill:#5b6773; }
      .note { fill:#f0f5f8; stroke:#174863; stroke-width:1.2; }
    ]]></style>
  </defs>

  <rect class="page" x="0" y="0" width="1000" height="1200"/>
  <text class="title" x="42" y="45">Robot 2 — schéma cinématique 4R normalisé</text>
  <text class="small" x="42" y="72">Pose : q₁ = 45°, q₂ = 25°, q₃ = 65°, q₄ = 90° ; b = q₂ + q₃ − 90° = 0°</text>

  <!-- Main longitudinal projection. -->
  <g transform="translate(0 15) scale(0.86)">
  <rect class="panel" x="34" y="88" width="1044" height="804" rx="6"/>
  <text class="subtitle" x="58" y="122">Vue longitudinale dans le plan tournant Π(q₁)</text>
  <text class="small" x="58" y="146">ρ radial, z vertical ; +e<tspan baseline-shift="sub">t</tspan> est entrant dans la feuille (⊗)</text>

  <g transform="translate(0 32)">

  <!-- Ground and fixed chain. -->
  <line class="fixed" x1="82" y1="800" x2="300" y2="800"/>
  <line class="fixed" x1="180" y1="800" x2="180" y2="469"/>
  <line class="fixed" x1="180" y1="469" x2="225" y2="469"/>
  <g stroke="#253342" stroke-width="2">
    <line x1="92" y1="800" x2="78" y2="815"/><line x1="116" y1="800" x2="102" y2="815"/>
    <line x1="140" y1="800" x2="126" y2="815"/><line x1="164" y1="800" x2="150" y2="815"/>
    <line x1="188" y1="800" x2="174" y2="815"/><line x1="212" y1="800" x2="198" y2="815"/>
    <line x1="236" y1="800" x2="222" y2="815"/><line x1="260" y1="800" x2="246" y2="815"/>
    <line x1="284" y1="800" x2="270" y2="815"/>
  </g>
  <text class="label" x="83" y="843">bâti / sol fini</text>

  <!-- Active serial chain. -->
  <polyline class="member" points="225,469 339,224 579,224"/>
  <line class="member" x1="579" y1="224" x2="579" y2="316"/>
  <line class="member" x1="579" y1="316" x2="579" y2="343"/>
  <line class="member" x1="524" y1="343" x2="634" y2="343"/>

  <!-- Passive four-bar transmission; doubled graphically to recall the twin rods. -->
  <line class="passive" x1="180" y1="396" x2="294" y2="151"/>
  <line class="passive" x1="187" y1="400" x2="301" y2="155"/>
  <line class="passive" x1="225" y1="469" x2="180" y2="398"/>
  <line class="passive" x1="339" y1="224" x2="296" y2="153"/>
  <circle cx="180" cy="398" r="5" fill="#8c969d"/>
  <circle cx="296" cy="153" r="5" fill="#8c969d"/>
  <text class="dimtext" x="164" y="314" transform="rotate(-65 164 314)">2 bielles E : L<tspan baseline-shift="sub">E</tspan> = L₁</text>

  <!-- Conventional joint symbols. -->
  <rect class="joint-plane" x="168" y="662" width="24" height="34"/>
  <line x1="180" y1="651" x2="180" y2="707" stroke="#253342" stroke-width="2"/>
  <text class="label" x="201" y="684">J1</text>

  <circle class="joint-normal" cx="225" cy="469" r="14"/>
  <line class="axis-cross" x1="218" y1="462" x2="232" y2="476"/>
  <line class="axis-cross" x1="232" y1="462" x2="218" y2="476"/>
  <text class="label" x="242" y="493">J2</text>

  <circle class="joint-normal" cx="339" cy="224" r="14"/>
  <line class="axis-cross" x1="332" y1="217" x2="346" y2="231"/>
  <line class="axis-cross" x1="346" y1="217" x2="332" y2="231"/>
  <line class="construction" x1="348" y1="237" x2="382" y2="263"/>
  <text class="label" x="390" y="278">J3 — q₃ généralisé</text>

  <rect class="joint-plane" x="567" y="298" width="24" height="36"/>
  <line x1="579" y1="286" x2="579" y2="345" stroke="#253342" stroke-width="2"/>
  <text class="label" x="600" y="337">J4</text>
  <text class="label" x="650" y="455">tool0 (cible d’inspection)</text>

  <!-- Position labels. -->
  <text class="math" x="145" y="786">O<tspan baseline-shift="sub">W</tspan></text>
  <text class="math" x="201" y="673">O₀ (DH)</text>
  <text class="math" x="70" y="448">O₁ (DH) ≡ épaule</text>
  <text class="math" x="276" y="205">O₂ (DH)</text>
  <text class="math" x="690" y="245">O₃ ≡ N ∈ axe J4</text>
  <text class="math" x="720" y="342">O₄ ≡ j4_output</text>

  <!-- Reference directions and frames. -->
  <line class="axis-x" x1="180" y1="800" x2="250" y2="800"/>
  <line class="axis-z" x1="180" y1="800" x2="180" y2="730"/>
  <circle cx="180" cy="800" r="11" fill="#ffffff" stroke="#087f8c" stroke-width="2"/>
  <line x1="174" y1="794" x2="186" y2="806" stroke="#087f8c" stroke-width="2"/>
  <line x1="186" y1="794" x2="174" y2="806" stroke="#087f8c" stroke-width="2"/>
  <text x="255" y="806" fill="#a44b42" font-family="DejaVu Sans" font-size="20">êρ</text>
  <text x="190" y="738" fill="#174863" font-family="DejaVu Sans" font-size="20">êz = z<tspan baseline-shift="sub">W</tspan> ∥ z₀</text>
  <text x="136" y="824" fill="#087f8c" font-family="DejaVu Sans" font-size="20">êt ⊗</text>

  <!-- DH frame R1 at shoulder; the joint glyph already carries z1 into the page. -->
  <line class="axis-x" x1="225" y1="469" x2="292" y2="469"/>
  <line class="axis-y" x1="225" y1="469" x2="225" y2="525"/>
  <text class="frame" x="306" y="522">R₁ : x₁, y₁, z₁ ⊗</text>

  <!-- DH frame R2 at elbow. -->
  <line class="axis-x" x1="339" y1="224" x2="365" y2="169"/>
  <line class="axis-y" x1="339" y1="224" x2="386" y2="246"/>
  <text class="frame" x="370" y="325">R₂ : x₂, y₂, z₂ ⊗</text>

  <!-- DH frame R3 at the point N on the J4 axis. -->
  <line class="axis-x" x1="579" y1="224" x2="649" y2="224"/>
  <line class="axis-z" x1="579" y1="224" x2="579" y2="164"/>
  <circle cx="579" cy="224" r="9" fill="#ffffff" stroke="#087f8c" stroke-width="2"/>
  <line x1="574" y1="219" x2="584" y2="229" stroke="#087f8c" stroke-width="2"/>
  <line x1="584" y1="219" x2="574" y2="229" stroke="#087f8c" stroke-width="2"/>
  <text class="frame" x="720" y="175">R₃ : x₃, y₃ ⊗, z₃</text>
  <text class="frame" x="620" y="305">z₄ = z₃</text>

  <!-- Angle constructions. -->
  <line class="construction" x1="225" y1="469" x2="225" y2="374"/>
  <path class="angle" d="M225,414 A55,55 0 0 1 248,419"/>
  <text x="255" y="406" fill="#986119" font-family="DejaVu Sans" font-size="20">q₂ = 25°</text>
  <text class="small" x="280" y="495">a = q₂ − 90° = −65°</text>
  <path class="angle" d="M360,179 A50,50 0 0 1 389,224"/>
  <text x="390" y="160" fill="#986119" font-family="DejaVu Sans" font-size="20">q₃ = 65°</text>
  <line class="construction" x1="515" y1="251" x2="650" y2="251"/>
  <text x="760" y="215" fill="#986119" font-family="DejaVu Sans" font-size="20">b = 0° ; z₃ ∥ z₀</text>

  <!-- Dimensions. -->
  <line class="extension" x1="180" y1="800" x2="115" y2="800"/>
  <line class="extension" x1="180" y1="679" x2="115" y2="679"/>
  <line class="dimension" x1="120" y1="795" x2="120" y2="684"/>
  <text class="dimtext" x="62" y="744">h₁ = 0,403 m</text>
  <line class="extension" x1="180" y1="469" x2="115" y2="469"/>
  <line class="dimension" x1="120" y1="674" x2="120" y2="474"/>
  <text class="dimtext" x="54" y="579">Hc = 0,700 m</text>
  <line class="extension" x1="180" y1="469" x2="180" y2="540"/>
  <line class="extension" x1="225" y1="469" x2="225" y2="540"/>
  <line class="dimension" x1="185" y1="532" x2="220" y2="532"/>
  <text class="dimtext" x="176" y="555">A₁ = 0,150 m</text>
  <text class="dimtext" x="315" y="365" transform="rotate(-65 315 365)">L₁ = 0,900 m</text>
  <text class="dimtext" x="450" y="215">L₂ = 0,800 m</text>
  <line class="extension" x1="579" y1="224" x2="682" y2="224"/>
  <line class="extension" x1="579" y1="316" x2="682" y2="316"/>
  <line class="dimension" x1="674" y1="229" x2="674" y2="311"/>
  <text class="dimtext" x="720" y="285">Zc = −0,308 m</text>
  <line class="extension" x1="579" y1="343" x2="682" y2="343"/>
  <line class="dimension" x1="654" y1="321" x2="654" y2="338"/>
  <text class="dimtext" x="720" y="382">dT = −0,089 m</text>

  <!-- Physical J3 actuation is coaxial at the shoulder; q3 remains the elbow coordinate. -->
  <polyline class="construction" points="191,414 330,414 403,396"/>
  <text class="small" x="410" y="397">sortie actionneur J3 coaxiale à J2</text>
  <text class="small" x="410" y="423">angle absolu b = q₂ + q₃ − 90°</text>
  </g>

  <rect class="note" x="690" y="625" width="355" height="260" rx="4"/>
  <text class="label" x="712" y="657">Lecture des axes</text>
  <text class="small" x="712" y="693">• J1 : +Z monde.</text>
  <text class="small" x="712" y="727">• J2 et J3 : +Y local.</text>
  <text class="small" x="712" y="761">• J4 : +z<tspan baseline-shift="sub">D</tspan> local</text>
  <text class="small" x="730" y="789">(+Z de sa liaison).</text>
  <text class="small" x="712" y="823">• DH : J<tspan baseline-shift="sub">i</tspan> est porté par z<tspan baseline-shift="sub">i−1</tspan>.</text>
  <text class="small" x="712" y="851">• Bielles : transmission J3 ;</text>
  <text class="small" x="730" y="877">aucun ddl ajouté.</text>
  </g>

  <!-- Top-view inset for q1 and q4. -->
  <g transform="translate(25 805) scale(0.92) translate(-1102 -88)">
  <rect class="panel" x="1102" y="88" width="464" height="380" rx="6"/>
  <text class="subtitle" x="1124" y="122">Vue de dessus — plan XY</text>
  <text class="small" x="1124" y="145">Cas b = 0 : z₄ vertical, ψ = q₁ + q₄</text>
  <g transform="translate(0 45)">
  <circle class="joint-normal" cx="1290" cy="312" r="14"/>
  <circle class="axis-dot" cx="1290" cy="312" r="4"/>
  <text class="label" x="1268" y="342">J1 : z₀ ⊙</text>
  <line class="axis-x" x1="1290" y1="312" x2="1460" y2="312"/>
  <line class="axis-y" x1="1290" y1="312" x2="1290" y2="172"/>
  <text x="1464" y="317" fill="#a44b42" font-family="DejaVu Sans" font-size="20">x₀</text>
  <text x="1300" y="178" fill="#087f8c" font-family="DejaVu Sans" font-size="20">y₀</text>
  <line class="construction" x1="1290" y1="312" x2="1490" y2="112"/>
  <line class="member" x1="1290" y1="312" x2="1432" y2="170"/>
  <path class="angle" d="M1360,312 A70,70 0 0 0 1339,263"/>
  <text x="1365" y="271" fill="#986119" font-family="DejaVu Sans" font-size="20">q₁ = 45°</text>
  <circle cx="1432" cy="170" r="9" fill="#ffffff" stroke="#174863" stroke-width="2"/>
  <circle class="axis-dot" cx="1432" cy="170" r="3"/>
  <line class="axis-x" x1="1432" y1="170" x2="1373" y2="111"/>
  <line class="axis-y" x1="1432" y1="170" x2="1373" y2="229"/>
  <text x="1335" y="126" fill="#a44b42" font-family="DejaVu Sans" font-size="20">x₄</text>
  <text x="1353" y="239" fill="#087f8c" font-family="DejaVu Sans" font-size="20">y₄</text>
  <line class="construction" x1="1432" y1="170" x2="1491" y2="111"/>
  <path class="angle" d="M1473,129 A58,58 0 0 0 1391,129"/>
  <text x="1460" y="205" fill="#986119" font-family="DejaVu Sans" font-size="20">q₄ = 90°</text>
  <text class="frame" x="1445" y="238">R₄ : z₄ ⊙</text>
  </g>
  <text class="small" x="1125" y="420">x₄ donne le lacet de l’outil.</text>
  <text class="small" x="1125" y="448">z₄ ⊙ ; ψ = q₁ + q₄ = 135° ici.</text>
  </g>

  <!-- Graphic convention legend. -->
  <g transform="translate(525 805) scale(0.92) translate(-1102 -474)">
  <rect class="panel" x="1102" y="474" width="464" height="362" rx="6"/>
  <text class="subtitle" x="1124" y="508">Symboles de tracé</text>
  <rect class="joint-plane" x="1135" y="528" width="26" height="36"/>
  <text class="label" x="1182" y="553">pivot, axe dans le plan — J1/J4</text>
  <circle class="joint-normal" cx="1148" cy="596" r="15"/>
  <line class="axis-cross" x1="1141" y1="589" x2="1155" y2="603"/>
  <line class="axis-cross" x1="1155" y1="589" x2="1141" y2="603"/>
  <text class="label" x="1182" y="603">pivot, axe entrant — J2/J3</text>
  <line class="fixed" x1="1128" y1="642" x2="1172" y2="642"/>
  <line x1="1134" y1="642" x2="1124" y2="654" stroke="#253342" stroke-width="2"/>
  <line x1="1150" y1="642" x2="1140" y2="654" stroke="#253342" stroke-width="2"/>
  <line x1="1166" y1="642" x2="1156" y2="654" stroke="#253342" stroke-width="2"/>
  <text class="label" x="1182" y="649">liaison au bâti</text>
  <circle cx="1140" cy="690" r="13" fill="#ffffff" stroke="#253342" stroke-width="2"/>
  <circle cx="1140" cy="690" r="4" fill="#253342"/>
  <circle cx="1170" cy="690" r="13" fill="#ffffff" stroke="#253342" stroke-width="2"/>
  <line x1="1163" y1="683" x2="1177" y2="697" stroke="#253342" stroke-width="2"/>
  <line x1="1177" y1="683" x2="1163" y2="697" stroke="#253342" stroke-width="2"/>
  <text class="label" x="1200" y="697">axe sortant ⊙ / entrant ⊗</text>
  <line class="member" x1="1128" y1="735" x2="1171" y2="735"/>
  <text class="label" x="1182" y="742">segment cinématique sans volume</text>
  <line class="passive" x1="1128" y1="778" x2="1171" y2="778"/>
  <text class="label" x="1182" y="785">bielle passive de transmission</text>
  <line class="axis-x" x1="1128" y1="817" x2="1148" y2="817"/>
  <line class="axis-y" x1="1152" y1="817" x2="1172" y2="817"/>
  <line class="axis-z" x1="1176" y1="817" x2="1196" y2="817"/>
  <text class="tiny" x="1210" y="824">axes unitaires : x / y / z</text>
  </g>

  <text class="tiny" x="42" y="1178">Schéma de calcul — longueurs proportionnelles ; symboles agrandis ; non coté pour fabrication.</text>
</svg>
