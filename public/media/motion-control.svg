<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1205" viewBox="0 0 1000 1205" role="img" aria-labelledby="title desc">
  <title id="title">Du calcul de posture à l'effort appliqué dans Gazebo</title>
  <desc id="desc">Le solveur analytique fournit les angles, les quintiques et la mise à l'échelle fournissent le temps, MoveIt vérifie les états et transmet l'exécution au JointTrajectoryController. Le module d'effort associe correction, gravité série et anticipation inertielle NumPy, puis limite en coordonnées d'actionneur. Les positions et vitesses simulées reviennent au contrôleur et au module.</desc>
  <defs>
    <marker id="arrow-ink" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#183548" />
    </marker>
    <marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#087F8C" />
    </marker>
    <marker id="arrow-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#9A6318" />
    </marker>
  </defs>
  <rect width="1000" height="1335" fill="white" />
  <g font-family="Arial, sans-serif">
    <text x="34" y="36" font-size="30" fill="#183548" font-weight="700" font-style="normal" text-anchor="start">DE LA CIBLE À LA RÉPONSE SIMULÉE</text>
    <text x="35" y="67" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">Zoom C3–C4–C5 · la voie composite réellement utilisée en v6</text>
    <g id="C2">
      <rect x="40" y="98" width="880" height="97" rx="12" fill="white" stroke="#CFD9E1" stroke-width="1.4" />
      <path d="M41 112V181" stroke="#6633CC" stroke-width="5" stroke-linecap="round" />
      <text x="58" y="127" font-size="24" fill="#183548" font-weight="700" font-style="normal" text-anchor="start">C2  Choisir la destination</text>
      <text x="58" y="158" font-size="24" fill="#6633CC" font-weight="400" font-style="italic" text-anchor="start">Orchestrateur multicartons</text>
      <text x="58" y="187" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">Pose visée · état chargé / vide</text>
    </g>
    <rect x="28" y="222" width="904" height="325" rx="12" fill="#F5F2FC" stroke="#F5F2FC" stroke-width="1.4" />
    <text x="388" y="253" font-size="24" fill="#183548" font-weight="700" font-style="normal" text-anchor="start">C3  PRÉPARER ET VÉRIFIER</text>
    <g id="C3-ik">
      <rect x="48" y="278" width="309" height="110" rx="12" fill="white" stroke="#CFD9E1" stroke-width="1.4" />
      <path d="M49 292V374" stroke="#6633CC" stroke-width="5" stroke-linecap="round" />
      <text x="66" y="307" font-size="24" fill="#183548" font-weight="700" font-style="normal" text-anchor="start">Calculer la posture</text>
      <text x="66" y="338" font-size="24" fill="#6633CC" font-weight="400" font-style="italic" text-anchor="start">Solveur analytique</text>
      <text x="66" y="367" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">Mode outil horizontal</text>
    </g>
    <g id="C3-quintics">
      <rect x="532" y="278" width="380" height="110" rx="12" fill="white" stroke="#CFD9E1" stroke-width="1.4" />
      <path d="M533 292V374" stroke="#6633CC" stroke-width="5" stroke-linecap="round" />
      <text x="550" y="307" font-size="24" fill="#183548" font-weight="700" font-style="normal" text-anchor="start">Construire le temps</text>
      <text x="550" y="338" font-size="24" fill="#6633CC" font-weight="400" font-style="italic" text-anchor="start">Quintiques composites</text>
      <text x="550" y="367" font-size="24" fill="#6633CC" font-weight="400" font-style="italic" text-anchor="start">Mise à l'échelle</text>
    </g>
    <path d="M202 195V278" fill="none" stroke="#183548" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)" />
    <text x="216" y="218" font-size="24" fill="#183548" font-weight="400" font-style="normal" text-anchor="start">pose visée</text>
    <path d="M357 335H532" fill="none" stroke="#183548" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)" />
    <text x="444" y="320" font-size="24" fill="#183548" font-weight="400" font-style="normal" text-anchor="middle">angles cibles</text>
    <g id="C3-validation">
      <rect x="532" y="448" width="380" height="83" rx="12" fill="white" stroke="#CFD9E1" stroke-width="1.4" />
      <path d="M533 462V517" stroke="#6633CC" stroke-width="5" stroke-linecap="round" />
      <text x="550" y="477" font-size="24" fill="#183548" font-weight="700" font-style="normal" text-anchor="start">Contrôler les états</text>
      <text x="550" y="508" font-size="24" fill="#6633CC" font-weight="400" font-style="italic" text-anchor="start">MoveIt 2 : collisions</text>
    </g>
    <path d="M722 388V448" fill="none" stroke="#183548" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)" />
    <text x="704" y="428" font-size="24" fill="#183548" font-weight="400" font-style="normal" text-anchor="end">trajectoire datée</text>
    <text x="50" y="445" font-size="24" fill="#183548" font-weight="700" font-style="normal" text-anchor="start">Chemin et durée :</text>
    <text x="50" y="476" font-size="24" fill="#183548" font-weight="400" font-style="normal" text-anchor="start">construits par le projet,</text>
    <text x="50" y="507" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">pas par OMPL / TOTG / Ruckig.</text>
    <g id="P2b">
      <rect x="40" y="603" width="380" height="133" rx="12" fill="white" stroke="#CFD9E1" stroke-width="1.4" />
      <path d="M41 617V722" stroke="#6633CC" stroke-width="5" stroke-linecap="round" />
      <text x="58" y="632" font-size="24" fill="#183548" font-weight="700" font-style="normal" text-anchor="start">P2b  Anticiper l'inertie</text>
      <text x="58" y="663" font-size="24" fill="#6633CC" font-weight="400" font-style="italic" text-anchor="start">Modèle fermé · NumPy</text>
      <text x="58" y="692" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">M_c(qᵣ) × accélération q̈ᵣ</text>
      <text x="58" y="721" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">Chargé / vide selon la phase</text>
    </g>
    <g id="C4-jtc">
      <rect x="550" y="603" width="370" height="133" rx="12" fill="white" stroke="#CFD9E1" stroke-width="1.4" />
      <path d="M551 617V722" stroke="#6633CC" stroke-width="5" stroke-linecap="round" />
      <text x="568" y="632" font-size="24" fill="#183548" font-weight="700" font-style="normal" text-anchor="start">C4a  Corriger le suivi</text>
      <text x="568" y="663" font-size="24" fill="#6633CC" font-weight="400" font-style="italic" text-anchor="start">JointTrajectoryController</text>
      <text x="568" y="692" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">Référence interpolée</text>
      <text x="568" y="721" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">Écarts de position et vitesse</text>
    </g>
    <path d="M722 531V603" fill="none" stroke="#183548" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)" />
    <text x="708" y="568" font-size="24" fill="#183548" font-weight="400" font-style="normal" text-anchor="end">action d'exécution</text>
    <text x="479" y="640" font-size="24" fill="#183548" font-weight="400" font-style="normal" text-anchor="middle">qᵣ, q̈ᵣ</text>
    <path d="M550 659H420" fill="none" stroke="#183548" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)" />
    <text x="479" y="686" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="middle">référence</text>
    <text x="479" y="715" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="middle">interpolée</text>
    <text x="244" y="764" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">Repli : efforts préprogrammés interpolés.</text>
    <g id="C4-effort">
      <rect x="40" y="823" width="880" height="156" rx="12" fill="#F5F2FC" stroke="#CFD9E1" stroke-width="1.4" />
      <path d="M41 837V965" stroke="#6633CC" stroke-width="5" stroke-linecap="round" />
      <text x="58" y="852" font-size="24" fill="#183548" font-weight="700" font-style="normal" text-anchor="start">C4b  Assembler et limiter la commande</text>
      <text x="58" y="883" font-size="24" fill="#6633CC" font-weight="400" font-style="italic" text-anchor="start">Module d'effort</text>
      <text x="58" y="912" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">Correction + gravité série + anticipation inertielle</text>
      <text x="58" y="941" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">Couples q → u · limites motrices · retour u → q</text>
      <text x="58" y="970" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">Réaction d'inertie des transmissions et contributions passives</text>
    </g>
    <path d="M225 736V823" fill="none" stroke="#183548" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)" />
    <text x="244" y="803" font-size="24" fill="#183548" font-weight="400" font-style="normal" text-anchor="start">effort inertiel</text>
    <path d="M730 736V823" fill="none" stroke="#183548" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)" />
    <text x="711" y="798" font-size="24" fill="#183548" font-weight="400" font-style="normal" text-anchor="end">correction PID</text>
    <path d="M490 979V1037" fill="none" stroke="#183548" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)" />
    <text x="474" y="1005" font-size="24" fill="#183548" font-weight="400" font-style="normal" text-anchor="end">efforts articulaires appliqués</text>
    <g id="C5">
      <rect x="272" y="1037" width="500" height="107" rx="12" fill="#EEF8F7" stroke="#CFD9E1" stroke-width="1.4" />
      <path d="M273 1051V1130" stroke="#087F8C" stroke-width="5" stroke-linecap="round" />
      <text x="290" y="1066" font-size="24" fill="#183548" font-weight="700" font-style="normal" text-anchor="start">C5  Calculer la réponse</text>
      <text x="290" y="1097" font-size="24" fill="#6633CC" font-weight="400" font-style="italic" text-anchor="start">Gazebo · DART</text>
      <text x="290" y="1126" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">Mouvement des corps et contacts</text>
    </g>
    <path d="M772 1090H960V665H920" fill="none" stroke="#087F8C" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)" />
    <path d="M960 908H920" fill="none" stroke="#087F8C" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)" />
    <text x="984" y="955" font-size="24" fill="#087F8C" font-weight="400" font-style="normal" text-anchor="start" transform="rotate(-90 984 955)">positions et vitesses simulées</text>
    <text x="40" y="1184" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">q : articulations du modèle série  ·  u : sorties des actionneurs couplés</text>
  </g>
</svg>
