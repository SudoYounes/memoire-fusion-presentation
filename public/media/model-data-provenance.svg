<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1025" viewBox="0 0 1000 1025" role="img" aria-labelledby="title desc">
<title id="title">Du modèle CAO aux deux représentations du mouvement</title><desc id="desc">La CAO fournit les propriétés regroupées en corps et une branche FEA indépendante. Un profil déclaré alimente séparément le substitut série URDF et le modèle dynamique fermé NumPy. Aucun résultat élastique FEA n'est injecté dans la physique rigide de Gazebo.</desc>
<defs><marker id="arrow-ink" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#183548"/></marker><marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#087F8C"/></marker><marker id="arrow-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#9A6318"/></marker></defs>
<rect width="1000" height="1025" fill="white"/>
<g font-family="Arial, sans-serif">
<text x="34" y="36" font-size="30" fill="#183548" font-weight="700" font-style="normal" text-anchor="start">UNE ORIGINE, DES MODÈLES DIFFÉRENTS</text>
<text x="35" y="67" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">Zoom P1 → P2 · ce que la mécanique transmet au simulateur</text>
<g id="P1">
<rect x="50" y="105" width="900" height="106" rx="12" fill="white" stroke="#CFD9E1" stroke-width="1.4"/>
<path d="M51 119V197" stroke="#9A6318" stroke-width="5" stroke-linecap="round"/>
<text x="68" y="134" font-size="24" fill="#183548" font-weight="700" font-style="normal" text-anchor="start">P1  CAO et propriétés par pièce</text>
<text x="68" y="165" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">Géométrie nominale · matériaux · propriétés de masse</text>
<text x="68" y="194" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">Les pièces solidaires et leurs repères définissent les futurs corps.</text>
</g>
<path d="M240 211V307" fill="none" stroke="#9A6318" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-gold)"/>
<text x="225" y="257" font-size="24" fill="#9A6318" font-weight="400" font-style="normal" text-anchor="end">géométrie +</text>
<text x="225" y="285" font-size="24" fill="#9A6318" font-weight="400" font-style="normal" text-anchor="end">charges d'étude</text>
<path d="M670 211V307" fill="none" stroke="#9A6318" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-gold)"/>
<text x="690" y="268" font-size="24" fill="#9A6318" font-weight="400" font-style="normal" text-anchor="start">pièces + propriétés</text>
<g id="P1-fea">
<rect x="40" y="307" width="310" height="269" rx="12" fill="#FFF8ED" stroke="#CFD9E1" stroke-width="1.4"/>
<path d="M41 321V562" stroke="#9A6318" stroke-width="5" stroke-linecap="round"/>
<text x="58" y="336" font-size="24" fill="#183548" font-weight="700" font-style="normal" text-anchor="start">Branche de conception</text>
<text x="58" y="367" font-size="24" fill="#6633CC" font-weight="400" font-style="italic" text-anchor="start">Gmsh · scikit-fem</text>
<text x="58" y="396" font-size="24" fill="#6633CC" font-weight="400" font-style="italic" text-anchor="start">SciPy / SuperLU</text>
<text x="58" y="425" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">Contraintes, déplacements</text>
<text x="58" y="454" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">→ choix de conception</text>
<text x="58" y="483" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start"></text>
<text x="58" y="512" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">Aucune élasticité injectée</text>
<text x="58" y="541" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">dans la boucle simulée.</text>
</g>
<g id="P1-bodies">
<rect x="410" y="307" width="540" height="132" rx="12" fill="white" stroke="#CFD9E1" stroke-width="1.4"/>
<path d="M411 321V425" stroke="#9A6318" stroke-width="5" stroke-linecap="round"/>
<text x="428" y="336" font-size="24" fill="#183548" font-weight="700" font-style="normal" text-anchor="start">Regrouper les pièces en corps</text>
<text x="428" y="367" font-size="24" fill="#6633CC" font-weight="400" font-style="italic" text-anchor="start">Générateur du modèle</text>
<text x="428" y="396" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">Masse · centre · inertie par corps</text>
<text x="428" y="425" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">Formes de collision simplifiées</text>
</g>
<path d="M670 439V510" fill="none" stroke="#9A6318" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-gold)"/>
<text x="690" y="485" font-size="24" fill="#9A6318" font-weight="400" font-style="normal" text-anchor="start">profil déclaré</text>
<g id="P2">
<rect x="410" y="510" width="540" height="136" rx="12" fill="#F5F2FC" stroke="#CFD9E1" stroke-width="1.4"/>
<path d="M411 524V632" stroke="#6633CC" stroke-width="5" stroke-linecap="round"/>
<text x="428" y="539" font-size="24" fill="#183548" font-weight="700" font-style="normal" text-anchor="start">P2  Contrats de simulation</text>
<text x="428" y="570" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">Profil allégé de référence</text>
<text x="428" y="599" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">≠ géométrie optimisée déjà réalisée</text>
<text x="428" y="628" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">Géométrie · inerties · limites</text>
</g>
<path d="M670 646V699H259V754" fill="none" stroke="#183548" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
<path d="M670 699H741V754" fill="none" stroke="#183548" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
<text x="502" y="729" font-size="24" fill="#183548" font-weight="700" font-style="normal" text-anchor="middle">DEUX MODÈLES, DEUX USAGES</text>
<g id="P2a">
<rect x="40" y="754" width="438" height="195" rx="12" fill="white" stroke="#CFD9E1" stroke-width="1.4"/>
<path d="M41 768V935" stroke="#6633CC" stroke-width="5" stroke-linecap="round"/>
<text x="58" y="783" font-size="24" fill="#183548" font-weight="700" font-style="normal" text-anchor="start">P2a  Substitut série</text>
<text x="58" y="814" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">URDF / SRDF</text>
<text x="58" y="843" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">Quatre articulations ; bielles</text>
<text x="58" y="872" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">sans fermeture explicite</text>
<text x="58" y="901" font-size="24" fill="#6633CC" font-weight="400" font-style="italic" text-anchor="start">MoveIt 2 · Gazebo</text>
<text x="58" y="930" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">→ collisions et physique rigide</text>
</g>
<g id="P2b">
<rect x="522" y="754" width="438" height="195" rx="12" fill="white" stroke="#CFD9E1" stroke-width="1.4"/>
<path d="M523 768V935" stroke="#6633CC" stroke-width="5" stroke-linecap="round"/>
<text x="540" y="783" font-size="24" fill="#183548" font-weight="700" font-style="normal" text-anchor="start">P2b  Modèle dynamique fermé</text>
<text x="540" y="814" font-size="24" fill="#6633CC" font-weight="400" font-style="italic" text-anchor="start">NumPy</text>
<text x="540" y="843" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">Bielles reconstruites depuis q</text>
<text x="540" y="872" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">Matrice de masse réduite M_c</text>
<text x="540" y="901" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">Cas chargé ou vide</text>
<text x="540" y="930" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">→ anticipation inertielle</text>
</g>
<text x="40" y="990" font-size="24" fill="#526476" font-weight="400" font-style="normal" text-anchor="start">« Fermé » décrit le mécanisme ; il ne désigne pas la boucle de régulation.</text>
</g></svg>
